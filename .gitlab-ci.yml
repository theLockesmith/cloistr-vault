default:
  tags:
    - local

stages:
  - test
  - build

.go-cache: &go-cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/
    policy: pull-push

include:
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/kaniko-build.yml'

test:unit:
  stage: test
  image: golang:1.25-bookworm
  <<: *go-cache
  variables:
    GOPATH: ${CI_PROJECT_DIR}/.go
    CGO_ENABLED: "1"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates build-essential
    - mkdir -p .go
  script:
    - cd backend
    - go mod tidy
    - go test -v -race -cover ./...
  coverage: '/coverage: \d+\.\d+% of statements/'

lint:
  stage: test
  image: golang:1.25-bookworm
  <<: *go-cache
  variables:
    GOPATH: ${CI_PROJECT_DIR}/.go
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl
    - mkdir -p .go
    - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin latest
  script:
    - cd backend
    - ${GOPATH}/bin/golangci-lint run --timeout 10m ./...
  allow_failure: true

build:
  extends: .kaniko-build
  stage: build
